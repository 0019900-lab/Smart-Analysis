name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Engine tests
        shell: bash
        run: |
          node tests/stats.test.mjs && node tests/logistic.test.mjs && node tests/analyses.test.mjs && node tests/dataops.test.mjs && node tests/validate/accuracy.test.mjs
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: Smart-Analysis-Setup, path: desktop/dist/*.exe }
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.exe }
